<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="smokeFadeA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a8a8a8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a8a8a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="smokeFadeB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c4c4c4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4c4c4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- smoke, rising straight up from the lit tip -->
  <g fill="none" stroke-linecap="round">
    <path d="M46 35 C 43 29, 49 25, 46 19 C 43 13, 50 9, 47 3"
          stroke="url(#smokeFadeA)" stroke-width="2.6"/>
    <path d="M41 36 C 38 31, 44 27, 40 22 C 36 17, 43 12, 39 5"
          stroke="url(#smokeFadeB)" stroke-width="2"/>
  </g>

  <!-- cigar body -->
  <rect x="6" y="36" width="40" height="12" rx="6" fill="url(#bodyGrad)"/>

  <!-- band -->
  <rect x="14" y="35.5" width="6" height="13" fill="#d8d8d8"/>
  <rect x="14" y="35.5" width="6" height="13" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>

  <!-- lit tip / ash -->
  <ellipse cx="46" cy="42" rx="5" ry="6" fill="#575757"/>
  <ellipse cx="46" cy="42" rx="2.6" ry="3.4" fill="#7f7f7f"/>
</svg>
